<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2060" viewBox="0 0 1600 2060"><rect width="100%" height="100%" fill="#F8FAFD"/><text x="40" y="50" font-family="Arial,sans-serif" font-size="20" fill="#536277" font-weight="700">EMAIL TEST CLIENT</text><text x="40" y="109" font-family="Arial,sans-serif" font-size="43" fill="#233247" font-weight="700">Email waiting and extraction workflow</text><text x="40" y="149" font-family="Arial,sans-serif" font-size="24" fill="#233247" font-weight="400">Main path in the center; retries and skipped candidates on the left; terminal failures on the right.</text><rect x="480" y="190" width="640" height="115" rx="16" fill="#E8F0FE" stroke="#2456A6" stroke-width="2"/><text x="502" y="230" font-family="Arial,sans-serif" font-size="24" fill="#2456A6" font-weight="700">1  Create the request identity</text><text x="502" y="260" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Generate a fresh qa+UUID@example.com address</text><text x="502" y="286" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Trigger application action; email may arrive now</text><rect x="480" y="350" width="640" height="115" rx="16" fill="#E8F0FE" stroke="#2456A6" stroke-width="2"/><text x="502" y="390" font-family="Arial,sans-serif" font-size="24" fill="#2456A6" font-weight="700">2  Enter the client context</text><text x="502" y="420" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Connect, choose transport, then LOGIN</text><text x="502" y="446" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Connection setup has its own network timeout</text><rect x="480" y="510" width="640" height="115" rx="16" fill="#E8F0FE" stroke="#2456A6" stroke-width="2"/><text x="502" y="550" font-family="Arial,sans-serif" font-size="24" fill="#2456A6" font-weight="700">3  Validate the wait request</text><text x="502" y="580" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Validate recipient, label, timeout and poll interval</text><text x="502" y="606" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Create monotonic deadline and empty UID cache</text><rect x="480" y="670" width="640" height="115" rx="16" fill="#E3F5F2" stroke="#087F79" stroke-width="2"/><text x="502" y="710" font-family="Arial,sans-serif" font-size="24" fill="#087F79" font-weight="700">4  Refresh the mailbox view</text><text x="502" y="740" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Read-only selection; obtain UIDVALIDITY</text><text x="502" y="766" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Clear cached UIDs if the namespace changed</text><rect x="480" y="830" width="640" height="115" rx="16" fill="#E3F5F2" stroke="#087F79" stroke-width="2"/><text x="502" y="870" font-family="Arial,sans-serif" font-size="24" fill="#087F79" font-weight="700">5  Search existing and arriving messages</text><text x="502" y="900" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">UID SEARCH HEADER To recipient</text><text x="502" y="926" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Server substring search produces candidates</text><rect x="480" y="990" width="640" height="145" rx="16" fill="#E3F5F2" stroke="#087F79" stroke-width="2"/><text x="502" y="1030" font-family="Arial,sans-serif" font-size="24" fill="#087F79" font-weight="700">6  Inspect each new candidate</text><text x="502" y="1060" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Skip cached UIDs; FETCH UID and BODY.PEEK[]</text><text x="502" y="1086" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Verify returned UID; parse exact To address</text><text x="502" y="1112" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Keep local-part case; ignore domain case</text><rect x="480" y="1180" width="640" height="145" rx="16" fill="#F0EAFB" stroke="#7044A4" stroke-width="2"/><text x="502" y="1220" font-family="Arial,sans-serif" font-size="24" fill="#7044A4" font-weight="700">7  Extract the requested button link</text><text x="502" y="1250" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Select and decode MIME HTML body</text><text x="502" y="1276" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Normalize full anchor label; preserve href parameters</text><text x="502" y="1302" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Require a valid absolute HTTP(S) URL</text><rect x="480" y="1370" width="640" height="115" rx="16" fill="#F0EAFB" stroke="#7044A4" stroke-width="2"/><text x="502" y="1410" font-family="Arial,sans-serif" font-size="24" fill="#7044A4" font-weight="700">8  Finish the candidate search snapshot</text><text x="502" y="1440" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Collect distinct valid destination URLs</text><text x="502" y="1466" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Identical destinations count as one result</text><rect x="480" y="1540" width="640" height="115" rx="16" fill="#E4F4E8" stroke="#287548" stroke-width="2"/><text x="502" y="1580" font-family="Arial,sans-serif" font-size="24" fill="#287548" font-weight="700">9  Evaluate the result set</text><text x="502" y="1610" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">One distinct URL: return it; conflicts: fail</text><text x="502" y="1636" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">No URL: sleep within remaining budget and retry</text><rect x="480" y="1770" width="640" height="115" rx="16" fill="#EDF1F5" stroke="#536277" stroke-width="2"/><text x="502" y="1810" font-family="Arial,sans-serif" font-size="24" fill="#536277" font-weight="700">10  Exit the client context</text><text x="502" y="1840" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Close the owned socket on success or exception</text><text x="502" y="1866" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">No STORE, DELETE, CLOSE or EXPUNGE commands</text><polyline points="800,305 800,350" fill="none" stroke="#536277" stroke-width="3"/><polygon points="800,350 806.0,338.0 794.0,338.0" fill="#536277"/><polyline points="800,465 800,510" fill="none" stroke="#536277" stroke-width="3"/><polygon points="800,510 806.0,498.0 794.0,498.0" fill="#536277"/><polyline points="800,625 800,670" fill="none" stroke="#536277" stroke-width="3"/><polygon points="800,670 806.0,658.0 794.0,658.0" fill="#536277"/><polyline points="800,785 800,830" fill="none" stroke="#536277" stroke-width="3"/><polygon points="800,830 806.0,818.0 794.0,818.0" fill="#536277"/><polyline points="800,945 800,990" fill="none" stroke="#536277" stroke-width="3"/><polygon points="800,990 806.0,978.0 794.0,978.0" fill="#536277"/><polyline points="800,1135 800,1180" fill="none" stroke="#536277" stroke-width="3"/><polygon points="800,1180 806.0,1168.0 794.0,1168.0" fill="#536277"/><polyline points="800,1325 800,1370" fill="none" stroke="#536277" stroke-width="3"/><polygon points="800,1370 806.0,1358.0 794.0,1358.0" fill="#536277"/><polyline points="800,1485 800,1540" fill="none" stroke="#536277" stroke-width="3"/><polygon points="800,1540 806.0,1528.0 794.0,1528.0" fill="#536277"/><polyline points="800,1655 800,1770" fill="none" stroke="#287548" stroke-width="3"/><polygon points="800,1770 806.0,1758.0 794.0,1758.0" fill="#287548"/><text x="830" y="1711" font-family="Arial,sans-serif" font-size="21" fill="#287548" font-weight="700">Return URL to caller</text><rect x="40" y="350" width="370" height="145" rx="16" fill="#E8F0FE" stroke="#2456A6" stroke-width="2"/><text x="62" y="390" font-family="Arial,sans-serif" font-size="24" fill="#2456A6" font-weight="700">Delivery can happen early</text><text x="62" y="420" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">The first search is immediate.</text><text x="62" y="446" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">No “only after wait started”</text><text x="62" y="472" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">timestamp or unread filter.</text><rect x="1180" y="350" width="380" height="145" rx="16" fill="#FCE9E9" stroke="#B43B44" stroke-width="2"/><text x="1202" y="390" font-family="Arial,sans-serif" font-size="24" fill="#B43B44" font-weight="700">Connection failure</text><text x="1202" y="420" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">AuthenticationError for LOGIN</text><text x="1202" y="446" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">MailboxError for connection</text><text x="1202" y="472" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">or protocol failures</text><polyline points="1120,405 1180,405" fill="none" stroke="#B43B44" stroke-width="3"/><polygon points="1180,405 1168.0,399.0 1168.0,411.0" fill="#B43B44"/><rect x="1180" y="670" width="380" height="170" rx="16" fill="#FCE9E9" stroke="#B43B44" stroke-width="2"/><text x="1202" y="710" font-family="Arial,sans-serif" font-size="24" fill="#B43B44" font-weight="700">Budget and protocol guard</text><text x="1202" y="740" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Check remaining time around</text><text x="1202" y="766" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">each IMAP operation. Cap socket</text><text x="1202" y="792" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">inactivity timeout to remaining</text><text x="1202" y="818" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">budget; expiry raises timeout.</text><polyline points="1120,725 1180,725" fill="none" stroke="#B43B44" stroke-width="3"/><polygon points="1180,725 1168.0,719.0 1168.0,731.0" fill="#B43B44"/><rect x="40" y="990" width="370" height="175" rx="16" fill="#FFF2DC" stroke="#A96505" stroke-width="2"/><text x="62" y="1030" font-family="Arial,sans-serif" font-size="24" fill="#A96505" font-weight="700">Continue candidate loop</text><text x="62" y="1060" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Cached UID: no body download</text><text x="62" y="1086" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Different To: skip this message</text><text x="62" y="1112" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Vanished body: continue</text><text x="62" y="1138" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">No HTML or label: skip</text><polyline points="480,1050 410,1050" fill="none" stroke="#A96505" stroke-width="3"/><polygon points="410,1050 422.0,1056.0 422.0,1044.0" fill="#A96505"/><rect x="1180" y="1180" width="380" height="175" rx="16" fill="#FCE9E9" stroke="#B43B44" stroke-width="2"/><text x="1202" y="1220" font-family="Arial,sans-serif" font-size="24" fill="#B43B44" font-weight="700">Extraction failure</text><text x="1202" y="1250" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Invalid matching URL or MIME</text><text x="1202" y="1276" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">decoding: LinkExtractionError</text><text x="1202" y="1302" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Different URLs for one label:</text><text x="1202" y="1328" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">AmbiguousLinkError</text><polyline points="1120,1240 1180,1240" fill="none" stroke="#B43B44" stroke-width="3"/><polygon points="1180,1240 1168.0,1234.0 1168.0,1246.0" fill="#B43B44"/><rect x="1180" y="1450" width="380" height="145" rx="16" fill="#FCE9E9" stroke="#B43B44" stroke-width="2"/><text x="1202" y="1490" font-family="Arial,sans-serif" font-size="24" fill="#B43B44" font-weight="700">Conflicting messages</text><text x="1202" y="1520" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">More than one distinct URL:</text><text x="1202" y="1546" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">raise AmbiguousLinkError.</text><text x="1202" y="1572" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Do not guess which is correct.</text><polyline points="1120,1570 1150,1570 1150,1510 1180,1510" fill="none" stroke="#B43B44" stroke-width="3"/><polygon points="1180,1510 1168.0,1504.0 1168.0,1516.0" fill="#B43B44"/><rect x="40" y="1380" width="370" height="145" rx="16" fill="#FFF2DC" stroke="#A96505" stroke-width="2"/><text x="62" y="1420" font-family="Arial,sans-serif" font-size="24" fill="#A96505" font-weight="700">No matching URL yet</text><text x="62" y="1450" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Sleep for min(poll interval,</text><text x="62" y="1476" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">remaining budget); poll again.</text><text x="62" y="1502" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">At deadline: EmailTimeoutError.</text><polyline points="480,1610 225,1610 225,1525" fill="none" stroke="#A96505" stroke-width="3"/><polygon points="225,1525 219.0,1537.0 231.0,1537.0" fill="#A96505"/><polyline points="225,1380 20,1380 20,725 480,725" fill="none" stroke="#A96505" stroke-width="3"/><polygon points="480,725 468.0,719.0 468.0,731.0" fill="#A96505"/><text x="45" y="700" font-family="Arial,sans-serif" font-size="20" fill="#A96505" font-weight="700">Retry until deadline</text><rect x="40" y="1770" width="370" height="115" rx="16" fill="#E4F4E8" stroke="#287548" stroke-width="2"/><text x="62" y="1810" font-family="Arial,sans-serif" font-size="24" fill="#287548" font-weight="700">Caller owns next action</text><text x="62" y="1840" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">The library returns the link.</text><text x="62" y="1866" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">It never opens or follows it.</text><rect x="1180" y="1770" width="380" height="115" rx="16" fill="#FCE9E9" stroke="#B43B44" stroke-width="2"/><text x="1202" y="1810" font-family="Arial,sans-serif" font-size="24" fill="#B43B44" font-weight="700">Failures remain explicit</text><text x="1202" y="1840" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">No automatic reconnect.</text><text x="1202" y="1866" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">No blanket retries of errors.</text><text x="40" y="1954" font-family="Arial,sans-serif" font-size="24" fill="#233247" font-weight="700">Concurrency: each caller owns a client; read-only operations preserve shared mailbox flags.</text><text x="40" y="1997" font-family="Arial,sans-serif" font-size="22" fill="#233247" font-weight="400">Result applies to the current search snapshot. Later conflicting deliveries are outside a returned result.</text><text x="40" y="2030" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Socket timeouts limit inactivity; DNS stalls or indefinite streaming do not have a hard wall-clock cancellation guarantee.</text></svg>