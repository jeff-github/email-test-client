<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1470" viewBox="0 0 1600 1470"><rect width="100%" height="100%" fill="#F8FAFD"/><text x="40" y="50" font-family="Arial,sans-serif" font-size="20" fill="#536277" font-weight="700">EMAIL TEST CLIENT</text><text x="40" y="109" font-family="Arial,sans-serif" font-size="43" fill="#233247" font-weight="700">Architecture and technology stack</text><text x="40" y="150" font-family="Arial,sans-serif" font-size="25" fill="#233247" font-weight="400">Verified deployment: Python tests on Windows; GreenMail in a Linux Docker container.</text><rect x="40" y="190" width="1000" height="1000" rx="16" fill="#FFFFFF" stroke="#A8BCD9" stroke-width="2"/><text x="65" y="230" font-family="Arial,sans-serif" font-size="23" fill="#2456A6" font-weight="700">WINDOWS HOST  /  PYTHON 3.13.7</text><rect x="75" y="265" width="930" height="125" rx="16" fill="#E8F0FE" stroke="#2456A6" stroke-width="2"/><text x="97" y="305" font-family="Arial,sans-serif" font-size="24" fill="#2456A6" font-weight="700">Test consumer and pytest harness</text><text x="97" y="335" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Fresh qa+UUID@example.com for each independent request</text><text x="97" y="361" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">54 fast tests + 16 E2E tests; SMTP fixtures simulate application email</text><rect x="75" y="440" width="930" height="115" rx="16" fill="#E8F0FE" stroke="#2456A6" stroke-width="2"/><text x="97" y="480" font-family="Arial,sans-serif" font-size="24" fill="#2456A6" font-weight="700">Public Python API</text><text x="97" y="510" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">ImapConfig  |  with EmailClient(config)  |  wait_for_link(...)</text><text x="97" y="536" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">extract_button_link(raw_email, button_text=...) can also run independently</text><rect x="75" y="610" width="440" height="160" rx="16" fill="#E3F5F2" stroke="#087F79" stroke-width="2"/><text x="97" y="650" font-family="Arial,sans-serif" font-size="24" fill="#087F79" font-weight="700">Email waiting and isolation</text><text x="97" y="680" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Immediate polling; exact To match</text><text x="97" y="706" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">UIDVALIDITY + per-wait UID cache</text><text x="97" y="732" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Monotonic budget; duplicate checks</text><rect x="565" y="610" width="440" height="160" rx="16" fill="#F0EAFB" stroke="#7044A4" stroke-width="2"/><text x="587" y="650" font-family="Arial,sans-serif" font-size="24" fill="#7044A4" font-weight="700">MIME and link extraction</text><text x="587" y="680" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Select HTML body; skip attachments</text><text x="587" y="706" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Decode charset + transfer encoding</text><text x="587" y="732" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Match button text; validate HTTP(S)</text><rect x="75" y="835" width="440" height="135" rx="16" fill="#E3F5F2" stroke="#087F79" stroke-width="2"/><text x="97" y="875" font-family="Arial,sans-serif" font-size="24" fill="#087F79" font-weight="700">IMAP adapter</text><text x="97" y="905" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">stdlib imaplib + ssl</text><text x="97" y="931" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Read-only EXAMINE, UID SEARCH</text><text x="97" y="957" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">UID FETCH (UID BODY.PEEK[])</text><rect x="565" y="835" width="440" height="135" rx="16" fill="#F0EAFB" stroke="#7044A4" stroke-width="2"/><text x="587" y="875" font-family="Arial,sans-serif" font-size="24" fill="#7044A4" font-weight="700">Parsing dependencies</text><text x="587" y="905" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">stdlib email + HTMLParser</text><text x="587" y="931" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">urllib.parse URL validation</text><text x="587" y="957" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">No runtime third-party packages</text><rect x="75" y="1020" width="930" height="130" rx="16" fill="#EDF1F5" stroke="#536277" stroke-width="2"/><text x="97" y="1060" font-family="Arial,sans-serif" font-size="24" fill="#536277" font-weight="700">Ownership and transport rules</text><text x="97" y="1090" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">One connection per concurrent caller; socket closes when context exits</text><text x="97" y="1116" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Library default: verified TLS on 993; STARTTLS / plaintext are explicit options</text><text x="97" y="1142" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Verified local E2E configuration: plaintext over loopback on port 33143</text><polyline points="290,390 290,440" fill="none" stroke="#536277" stroke-width="3"/><polygon points="290,440 296.0,428.0 284.0,428.0" fill="#536277"/><polyline points="290,555 290,610" fill="none" stroke="#536277" stroke-width="3"/><polygon points="290,610 296.0,598.0 284.0,598.0" fill="#536277"/><polyline points="515,690 565,690" fill="none" stroke="#7044A4" stroke-width="3"/><polygon points="565,690 553.0,684.0 553.0,696.0" fill="#7044A4"/><polyline points="290,770 290,835" fill="none" stroke="#536277" stroke-width="3"/><polygon points="290,835 296.0,823.0 284.0,823.0" fill="#536277"/><polyline points="785,770 785,835" fill="none" stroke="#7044A4" stroke-width="3"/><polygon points="785,835 791.0,823.0 779.0,823.0" fill="#7044A4"/><rect x="1080" y="485" width="480" height="700" rx="16" fill="#FFF9EF" stroke="#D8AE62" stroke-width="2"/><text x="1100" y="525" font-family="Arial,sans-serif" font-size="23" fill="#A96505" font-weight="700">DOCKER ENGINE 29.1.3</text><rect x="1110" y="555" width="420" height="135" rx="16" fill="#FFF2DC" stroke="#A96505" stroke-width="2"/><text x="1132" y="595" font-family="Arial,sans-serif" font-size="24" fill="#A96505" font-weight="700">SMTP service</text><text x="1132" y="625" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">127.0.0.1:33025 -&gt; container 3025</text><text x="1132" y="651" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Test fixture sends MIME messages</text><text x="1132" y="677" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">GreenMail standalone 2.1.15</text><rect x="1110" y="745" width="420" height="145" rx="16" fill="#FFF2DC" stroke="#A96505" stroke-width="2"/><text x="1132" y="785" font-family="Arial,sans-serif" font-size="24" fill="#A96505" font-weight="700">Shared qa mailbox</text><text x="1132" y="815" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Plus-address detail ignored</text><text x="1132" y="841" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Many unique recipients, one inbox</text><text x="1132" y="867" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Earlier messages remain present</text><rect x="1110" y="945" width="420" height="125" rx="16" fill="#FFF2DC" stroke="#A96505" stroke-width="2"/><text x="1132" y="985" font-family="Arial,sans-serif" font-size="24" fill="#A96505" font-weight="700">IMAP service</text><text x="1132" y="1015" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">127.0.0.1:33143 -&gt; container 3143</text><text x="1132" y="1041" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">LOGIN with disposable credentials</text><text x="1132" y="1067" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Read and inspect actual messages</text><text x="1105" y="1131" font-family="Arial,sans-serif" font-size="21" fill="#233247" font-weight="400">Compose manages startup and teardown.</text><polyline points="1005,320 1060,320 1060,610 1110,610" fill="none" stroke="#A96505" stroke-width="3"/><polygon points="1110,610 1098.0,604.0 1098.0,616.0" fill="#A96505"/><text x="1080" y="301" font-family="Arial,sans-serif" font-size="21" fill="#A96505" font-weight="700">SMTP delivery</text><polyline points="1320,690 1320,745" fill="none" stroke="#A96505" stroke-width="3"/><polygon points="1320,745 1326.0,733.0 1314.0,733.0" fill="#A96505"/><polyline points="1320,890 1320,945" fill="none" stroke="#A96505" stroke-width="3"/><polygon points="1320,945 1326.0,933.0 1314.0,933.0" fill="#A96505"/><polyline points="515,920 540,920 540,995 1110,995" fill="none" stroke="#087F79" stroke-width="3"/><polygon points="1110,995 1098.0,989.0 1098.0,1001.0" fill="#087F79"/><text x="650" y="992" font-family="Arial,sans-serif" font-size="19" fill="#087F79" font-weight="700">IMAP commands / responses</text><rect x="40" y="1230" width="1520" height="145" rx="16" fill="#E4F4E8" stroke="#287548" stroke-width="2"/><text x="62" y="1270" font-family="Arial,sans-serif" font-size="24" fill="#287548" font-weight="700">Verification and evidence</text><text x="62" y="1300" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">70 passing tests: 28 API + 25 extraction + 1 package + 16 E2E; 6 smoke cases overlap these totals</text><text x="62" y="1326" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Both supplied EML templates pass direct extraction, unchanged-byte IMAP and SMTP-to-IMAP checks</text><text x="62" y="1352" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">pytest / pytest-cov / Ruff / build  |  JUnit XML + coverage HTML/XML  |  93% branch-aware coverage</text><text x="45" y="1420" font-family="Arial,sans-serif" font-size="20" fill="#233247" font-weight="400">Limits: hosted CI, Python 3.12 execution and real TLS interoperability remain unverified. No live action URLs are opened.</text></svg>