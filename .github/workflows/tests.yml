name: Tests
on: [push, pull_request]
jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -m 'smoke and not e2e'
      - run: python -m pytest -m 'not e2e' --cov --cov-report=term-missing --cov-report=xml --junitxml=reports/fast.xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-results-${{ matrix.python }}
          path: |
            reports/
            coverage.xml
  e2e:
    needs: fast
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: docker compose up -d
      - run: python -m pytest --run-e2e -m 'smoke and e2e'
      - run: python -m pytest --run-e2e -m e2e --junitxml=reports/e2e.xml
      - run: docker compose logs
        if: failure()
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.python }}
          path: reports/
