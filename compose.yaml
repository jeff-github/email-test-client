services:
  greenmail:
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=qa:test-password@example.com
        -Dgreenmail.sieve.ignore.detail=true
    ports:
      - "127.0.0.1:33025:3025"
      - "127.0.0.1:33143:3143"

